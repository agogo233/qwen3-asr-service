name: Windows Portable (AMD64 + CUDA)

# 手动触发：构建 Windows AMD64 + CUDA cu124 便携打包。
# 产物为 ZIP，含 Python 3.12 Embeddable + 全量依赖 + ffmpeg，
# 解压至 asr-service/ 目录后运行 .\setup.ps1 即可启用。
#
# 注意：GitHub Release 单文件上限 2GB，本产物约 4-5GB，
# 只能走 Actions Artifact（上限 10GB，保留 1 天）。
#
# 构建步骤说明：
#   1. 清理 runner 工具缓存腾出磁盘空间
#   2. 下载 Python 3.12.10 Embeddable amd64（3.12.11+ 不再发布 embed zip）
#   3. 改写 _pth 启用 portable 模式（与 setup.ps1 Repair-EmbeddedPth 一致）
#   4. 安装 pip 到 lib\site-packages
#   5. 安装 CUDA PyTorch 全家桶（torch 2.6.0+cu124）
#   6. 安装 requirements.txt 其余依赖（先过滤 torch 三件套行，防 CPU 版重复下载）
#   7. 下载 ffmpeg（bin\ffmpeg.exe + bin\ffprobe.exe）
#   8. 冒烟验证：import torch/funasr/qwen_asr + pip check
#   8.5 脚本链路验证：构建目录上跑 setup.ps1(SKIP_INSTALL)/start.ps1 --help/import app.main
#   8.6 WebUI 启动冒烟：start.ps1 --web --device cpu 真实启动，轮询 /web-ui 与 /v2/health
#       （inputs.skip_webui_smoke=true 可跳过本步）
#   9. 7z 打包（排除 models/data/logs 等运行时目录与 __pycache__；.pip_cache 打包前删除）
#  10. 清理源目录后上传 artifact（保留 1 天）
#  11. 清理 >1 天的全部历史 runs（失败不阻塞构建结论）

on:
  workflow_dispatch:
    inputs:
      skip_webui_smoke:
        description: '跳过 8.6 WebUI 启动冒烟（网络抖动偶发红时的兜底开关；8.5 脚本链路验证仍执行）'
        type: boolean
        default: false

permissions:
  contents: read   # checkout 所需
  actions: write   # 末尾清理 step 删除 >1 天的历史 runs 所需

concurrency:
  group: windows-portable
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
        working-directory: asr-service

    steps:
      - uses: actions/checkout@v5

      # ── 1. 清理工具缓存 ──────────────────────────────────────────
      - name: Free disk space
        run: |
          $ErrorActionPreference = 'Stop'
          $cacheDir = 'C:\hostedtoolcache\windows'
          if (Test-Path $cacheDir) {
            $size = (Get-ChildItem $cacheDir -Recurse -Force -ErrorAction SilentlyContinue |
              Measure-Object -Property Length -Sum -ErrorAction SilentlyContinue).Sum
            Remove-Item -Recurse -Force $cacheDir -ErrorAction SilentlyContinue
            Write-Host "Removed tool cache: $([math]::Round($size / 1GB, 2)) GB"
          }
          $disk = Get-PSDrive C
          Write-Host "C: free $([math]::Round($disk.Free / 1GB, 1)) GB"

      # ── 1.5 pip wheel 缓存（torch cu124 wheel ~2.5GB + 全量依赖，命中免重下）─
      - name: Cache pip wheels
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}\pip-cache
          key: pip-win-${{ hashFiles('asr-service/requirements.txt') }}-cu124
          restore-keys: |
            pip-win-

      # ── 2. Python 3.12 Embeddable amd64 ──────────────────────────
      - name: Set up Python 3.12 embeddable
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip'
          Write-Host "Downloading Python 3.12.10 embeddable..."
          curl.exe -fsSL -o python-embed.zip $url
          if (-not (Test-Path python-embed.zip)) { throw "Python download failed" }
          Expand-Archive -Path python-embed.zip -DestinationPath bin\python -Force
          Remove-Item python-embed.zip
          $ver = & bin\python\python.exe -V 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Python.exe not working" }
          Write-Host "Python: $ver"

      # ── 3. 改写 _pth（与 setup.ps1 Repair-EmbeddedPth 一致） ────
      - name: Fix _pth for portable mode
        run: |
          $ErrorActionPreference = 'Stop'
          $pth = Get-ChildItem bin\python -Filter '*._pth' | Select-Object -First 1
          if (-not $pth) { throw "_pth file not found" }
          Copy-Item $pth.FullName "$($pth.FullName).bak" -Force
          Set-Content -Path $pth.FullName -Value @(
            'python312.zip',
            '.',
            '../..',
            '../../..',
            '../../lib/site-packages',
            'Lib\site-packages',
            'import site'
          ) -Encoding ASCII
          $ver = & bin\python\python.exe -V 2>&1
          if ($LASTEXITCODE -ne 0) { throw "_pth rewrite broke Python interpreter" }
          Write-Host "_pth rewritten and verified"

      # ── 4. 安装 pip 到 lib\site-packages ──────────────────────────
      - name: Install pip
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}\pip-cache
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -fsSL -o bin\get-pip.py https://bootstrap.pypa.io/get-pip.py
          if (-not (Test-Path bin\get-pip.py)) { throw "get-pip.py download failed" }
          & bin\python\python.exe bin\get-pip.py --target lib\site-packages --index-url https://pypi.org/simple
          if ($LASTEXITCODE -ne 0) { throw "pip installation failed" }
          $ver = & bin\python\python.exe -m pip --version 2>&1
          if ($LASTEXITCODE -ne 0) { throw "pip not working" }
          Write-Host "pip: $ver"

      # ── 5. CUDA PyTorch（cu124） ─────────────────────────────────
      - name: Install CUDA PyTorch
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}\pip-cache
        run: |
          $ErrorActionPreference = 'Stop'
          & bin\python\python.exe -m pip install `
            torch==2.6.0+cu124 torchaudio==2.6.0+cu124 torchvision==0.21.0+cu124 `
            --index-url https://download.pytorch.org/whl/cu124 `
            --target lib\site-packages
          if ($LASTEXITCODE -ne 0) { throw "CUDA torch installation failed" }
          $ver = & bin\python\python.exe -c "import torch; print(torch.__version__)" 2>&1
          if ($LASTEXITCODE -ne 0 -or $ver -notlike '*+cu124*') {
            throw "Torch version is not cu124: $ver"
          }
          Write-Host "torch: $ver"

      # ── 6. 其余依赖（先过滤 torch 三件套行再装） ─────────────────
      # pip --target 隐式忽略已安装包，不存在"已装 cu124 满足 ==2.6.0 即跳过"；
      # 不过滤会白下 ~200MB CPU wheel 并留下重复 dist-info，仅靠"目标目录已有
      # 文件不覆盖"的实现细节才保住 cu124。过滤后彻底消除该依赖路径。
      - name: Install remaining dependencies
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}\pip-cache
        run: |
          $ErrorActionPreference = 'Stop'
          $filtered = Join-Path $env:RUNNER_TEMP 'requirements-no-torch.txt'
          Get-Content requirements.txt |
            Where-Object { $_ -notmatch '^\s*torch(audio|vision)?==' } |
            Set-Content $filtered
          Write-Host "torch lines filtered, installing from $filtered"
          & bin\python\python.exe -m pip install -r $filtered `
            --index-url https://pypi.org/simple `
            --target lib\site-packages
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }
          $ver = & bin\python\python.exe -c "import torch; print(torch.__version__)" 2>&1
          if ($ver -notlike '*+cu124*') {
            throw "Torch was downgraded to non-CUDA version: $ver"
          }
          Write-Host "All dependencies installed, torch still cu124: $ver"

      # ── 7. ffmpeg（gyan.dev essentials） ─────────────────────────
      - name: Download ffmpeg
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Downloading ffmpeg..."
          curl.exe -fsSL -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          if (-not (Test-Path ffmpeg.zip)) { throw "ffmpeg download failed" }
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-temp -Force
          Remove-Item ffmpeg.zip
          $ffmpegDir = Get-ChildItem ffmpeg-temp -Directory |
            Where-Object Name -like 'ffmpeg-*' | Select-Object -First 1
          if (-not $ffmpegDir) { throw "ffmpeg directory not found in archive" }
          Copy-Item "$($ffmpegDir.FullName)\bin\ffmpeg.exe" bin\ffmpeg.exe
          Copy-Item "$($ffmpegDir.FullName)\bin\ffprobe.exe" bin\ffprobe.exe
          Remove-Item -Recurse -Force ffmpeg-temp
          $ffVer = & bin\ffmpeg.exe -version 2>&1 | Select-Object -First 1
          Write-Host "ffmpeg: $ffVer"

      # ── 8. 冒烟验证 ──────────────────────────────────────────────
      - name: Smoke test
        run: |
          $ErrorActionPreference = 'Stop'
          $result = & bin\python\python.exe -c 'import torch, funasr, qwen_asr; print("torch: " + torch.__version__); print("CUDA available: " + str(torch.cuda.is_available())); print("All imports OK")' 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Import smoke test failed: $result" }
          Write-Host $result
          & bin\python\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw "pip check failed" }
          Write-Host "Smoke test passed"

      # ── 8.5 脚本链路验证（构建目录即交付形态；PS5.1 兼容路径一并守住）──
      # setup.ps1 对已构建目录幂等：pip 已装跳过、_pth 重写内容与步骤 3 一致、
      # Select-ModelSource 仅内存变量无持久化（stdin=nul 默认 modelscope）
      - name: Verify scripts on built tree
        env:
          ASR_SETUP_SKIP_INSTALL: '1'
          PIP_INDEX_URL: https://pypi.org/simple
        run: |
          $ErrorActionPreference = 'Stop'
          # <nul 输入重定向仅 cmd 支持（pwsh 无 < 运算符），经 cmd /c 包装；
          # 输出落 RUNNER_TEMP，避免残留在打包目录
          $setupOut = Join-Path $env:RUNNER_TEMP 'setup_out.txt'
          cmd /c "powershell -NoProfile -ExecutionPolicy Bypass -File setup.ps1 < nul > `"$setupOut`" 2>&1"
          if ($LASTEXITCODE -ne 0) { Get-Content $setupOut; throw "setup.ps1 failed on built tree" }
          $out = Get-Content $setupOut -Raw
          if ($out -notmatch 'using portable mode') { throw "portable detection missing" }
          & bin\python\python.exe -m pip --version
          if ($LASTEXITCODE -ne 0) { throw "pip not available after setup.ps1" }
          Write-Host "[OK] setup.ps1 passed on built tree"

          $helpOut = Join-Path $env:RUNNER_TEMP 'help_out.txt'
          cmd /c "powershell -NoProfile -ExecutionPolicy Bypass -File start.ps1 --help < nul > `"$helpOut`" 2>&1"
          if ($LASTEXITCODE -ne 0) { Get-Content $helpOut; throw "start.ps1 --help failed" }
          if ((Get-Content $helpOut -Raw) -notmatch 'usage:') { throw "usage text missing" }
          Write-Host "[OK] start.ps1 --help passed"

          & bin\python\python.exe -c 'import app.main; from app.web.views import ASSETS_DIR; import os; assert os.path.isdir(ASSETS_DIR), "web assets missing"'
          if ($LASTEXITCODE -ne 0) { throw "import smoke failed" }
          Write-Host "[OK] app.main + web assets importable"

      # ── 8.6 WebUI 启动冒烟：真实拉起服务并断言 HTTP 响应 ──────────
      # 经 start.ps1 启动（bin\ 前置 PATH 使 check_ffmpeg 可达 ffmpeg；_pth 使 -m app.main 可达）。
      # CPU/OpenVINO 链路：HF 下载 INT8 模型（数百 MB）+ ModelScope VAD 小模型，预算 12 分钟。
      # 模型/logs/data 均落已被打包排除的目录；taskkill /T 清进程树防孤儿 python 锁 lib。
      - name: WebUI startup smoke
        if: ${{ inputs.skip_webui_smoke != true }}
        run: |
          $ErrorActionPreference = 'Stop'
          $svcOut = Join-Path $env:RUNNER_TEMP 'svc-out.log'
          $svcErr = Join-Path $env:RUNNER_TEMP 'svc-err.log'
          $proc = Start-Process powershell -PassThru -WindowStyle Hidden `
            -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','start.ps1',`
              '--web','--device','cpu','--host','127.0.0.1','--port','18080' `
            -RedirectStandardOutput $svcOut -RedirectStandardError $svcErr
          try {
            $ok = $false
            for ($i = 0; $i -lt 144; $i++) {
              Start-Sleep -Seconds 5
              if ($proc.HasExited) { break }
              try {
                $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 'http://127.0.0.1:18080/web-ui'
                if ($r.StatusCode -eq 200 -and $r.Content -like '*<div id="app">*') { $ok = $true; break }
              } catch { }
              if ($i % 6 -eq 5) {
                Write-Host "--- svc log tail (t=$($i * 5)s) ---"
                Get-Content $svcOut -Tail 15 -ErrorAction SilentlyContinue
              }
            }
            if (-not $ok) {
              Write-Host '=== svc-out.log ==='; Get-Content $svcOut -ErrorAction SilentlyContinue
              Write-Host '=== svc-err.log ==='; Get-Content $svcErr -ErrorAction SilentlyContinue
              throw "WebUI did not become ready within timeout (or service exited early)"
            }
            try {
              $h = Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 'http://127.0.0.1:18080/v2/health'
              if ($h.StatusCode -ne 200) { throw "health returned $($h.StatusCode)" }
              Write-Host "[OK] WebUI started and responding; health: $($h.Content)"
            } catch {
              Write-Host '=== svc-out.log ==='; Get-Content $svcOut -ErrorAction SilentlyContinue
              Write-Host '=== svc-err.log ==='; Get-Content $svcErr -ErrorAction SilentlyContinue
              throw "health check failed: $_"
            }
          }
          finally {
            if ($proc) { taskkill /PID $proc.Id /T /F 2>$null }
            Start-Sleep -Seconds 2
          }

      # ── 9. 打包 ──────────────────────────────────────────────────
      - name: Package
        id: package
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = "${{ github.sha }}".Substring(0, 7)
          $zipName = "qwen3-asr-service-win-amd64-cu124-${sha}.zip"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "zip_name=$zipName"
          # .pip_cache 用删除而非 -xr! 排除：7-Zip 26.02 对点开头掩码报
          # "Too short switch"；且 CI 构建中该目录本不存在（缓存指向 runner.temp），
          # 删除仅防御本地跑过 setup.bat 后手动打包的场景
          # __pycache__ 全局排除：8.5/8.6 运行产生的字节码不进包（site-packages 已有
          # pyc 一并排除，用户首启自动重编译，体积略减）
          Remove-Item -Recurse -Force .pip_cache -ErrorAction SilentlyContinue
          $7zExe = Get-Command '7z' -ErrorAction SilentlyContinue
          $7z = if ($7zExe) { '7z' } else { 'C:\Program Files\7-Zip\7z.exe' }
          & $7z a -mx=1 "..\$zipName" * `
            -xr!models -xr!data -xr!logs -xr!venv -xr!dist -xr!bin\get-pip.py -xr!__pycache__
          if ($LASTEXITCODE -ne 0) { throw "7z compression failed" }
          $size = (Get-Item "..\$zipName").Length / 1GB
          Write-Host "Package: $zipName ($([math]::Round($size, 2)) GB)"

      # ── 10. 清理源目录 + 上传 artifact ───────────────────────────
      - name: Clean up source dirs
        run: |
          Remove-Item -Recurse -Force lib, bin -ErrorAction SilentlyContinue
          $disk = Get-PSDrive C
          Write-Host "C: free $([math]::Round($disk.Free / 1GB, 1)) GB"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ github.workspace }}/${{ steps.package.outputs.zip_name }}
          if-no-files-found: error
          retention-days: 1

      # ── 11. 清理 >1 天的历史 runs ────────────────────────────────
      # 随构建顺带清理全部 workflows 的旧 runs；continue-on-error 使清理
      # 失败（如权限被仓库策略拦截）不影响本次构建结论。
      # gh run delete 成功时无输出，须以 $LASTEXITCODE 判定成败
      - name: Cleanup old runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cutoff = (Get-Date).ToUniversalTime().AddDays(-1).ToString('yyyy-MM-ddTHH:mm:ssZ')
          $runs = gh run list --limit 1000 --json databaseId,createdAt,status | ConvertFrom-Json
          $old = @($runs | Where-Object { $_.createdAt -lt $cutoff -and $_.status -notin 'in_progress', 'queued' })
          Write-Host "Found $($old.Count) run(s) created before $cutoff"
          $failed = 0
          foreach ($r in $old) {
            gh run delete $r.databaseId 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0) { Write-Host "deleted run $($r.databaseId)" }
            else { $failed++; Write-Host "skip run $($r.databaseId) (delete failed, exit $LASTEXITCODE)" }
          }
          if ($failed -gt 0) { Write-Host "::warning::$failed run(s) failed to delete" }